name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime and development dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements/dev.lock

      - name: Compile Python modules
        run: python -m compileall src scripts packaging

      - name: Run static quality baseline
        run: python scripts/generate_quality_baseline.py

      - name: Run CI-safe tests
        run: python -m pytest -m "not requires_raw_excel and not real_pipeline_acceptance and not performance"

      - name: Run source health check
        if: runner.os == 'Windows'
        run: python scripts/run_e2e.py --health-check

  package-contract:
    name: Packaging contract
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements/build.lock

      - name: Validate packaging entrypoint and spec
        run: python -m pytest tests/test_packaging_entrypoint.py tests/test_app_updates.py tests/test_update_security.py -q
      - name: Compile packaging scripts
        run: python -m compileall scripts packaging
