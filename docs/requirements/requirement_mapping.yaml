  - sheet: "勘定科目"
    max_row: 244
    max_column: 9
    role: "Master account; columns 製造/一般/販売"
  - sheet: "原価センタ"
    max_row: 66
    max_column: 5
    role: "Master Cost Center; use 原価区分 for account group"
canonical_rule_updates:
  - "Admin 12-month costs use total headcount from previous month. April 2026 uses April 2026 headcount because prior March is unavailable."
  - "Bus costs use scalar bus counts entered at the start of the app, independent from staff/worker/male/female headcount."
  - "Account lookup must follow Cost Center -> 原価センタ -> 原価区分 -> 勘定科目 column 製造/一般/販売 -> account_code. Do not use 採算区分 for this account-group choice."
canonical_10_07_items_requiring_current_audit:
  - "Export data begins from row 30."
  - "Collect Japanese and Vietnamese bus-passenger counts as explicit inputs."
  - "Complete Cost Center coverage for fixed assets."
  - "Remove duplicate health-check costs and correct new-hire stationery month allocation."
  - "Complete administrative allocation items, add output descriptions, and keep one blank row between source-file blocks."
derived_documents:
  - "docs/requirements/cai_tien_nhap_du_lieu_chung.md"
  - "QUY_TRINH_NGHIEP_VU_MP2027.md"
  - "docs/knowledge/mp_saisan_business_knowledge_base_v2.md"
fail_closed_policy:
  - "Do not invent data."
  - "Do not fallback from another Cost Center without explicit evidence."
  - "Do not convert blank to zero unless canonical source/test proves it."
  - "Missing or uncertain input must remain blank, be reported as missing input, or require user confirmation."

